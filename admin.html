<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRIX WOMEN | Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f8f4ef;--ink:#211b1b;--accent:#8c626c;--line:#e8dcd8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px Arial,sans-serif}main{max-width:1000px;margin:45px auto;padding:0 18px}h1{font-family:Georgia,serif;letter-spacing:2px}h2{font-family:Georgia,serif}.panel{background:white;padding:25px;border:1px solid var(--line);border-radius:12px;margin-bottom:20px}input,textarea{width:100%;padding:13px;margin:7px 0 15px;border:1px solid #d9ceca;border-radius:7px;font:inherit}button{background:var(--ink);color:white;border:0;padding:12px 18px;border-radius:7px;cursor:pointer;margin:4px 6px 4px 0}button.secondary{background:var(--accent)}button.danger{background:#a63838}button:disabled{opacity:.55;cursor:wait}.hidden{display:none!important}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.product{border:1px solid var(--line);border-radius:10px;padding:13px;background:#fff}.product img{width:100%;height:230px;object-fit:cover;border-radius:6px}.product h3{margin-bottom:5px}.muted{color:#776b68}.msg{min-height:24px;white-space:pre-wrap}a{color:var(--accent)}
</style>
</head>
<body><main>
<div class="top"><h1>PRIX WOMEN · ADMIN</h1><div><a href="index.html">Shiko faqen</a> <button id="logout" class="secondary hidden">Dil</button></div></div>
<p id="message" class="msg" role="status"></p>
<section id="loginPanel" class="panel"><h2>Hyr si administratore</h2><form id="loginForm"><label>Email<input type="email" id="email" required autocomplete="username"></label><label>Fjalëkalimi<input type="password" id="password" required autocomplete="current-password"></label><button type="submit">Hyr</button></form></section>
<div id="adminArea" class="hidden"><section class="panel"><h2 id="formTitle">Shto produkt</h2><form id="productForm"><label>Emri i produktit<input id="name" maxlength="150" required></label><label>Çmimi<input id="price" maxlength="70" placeholder="P.sh. 45 €"></label><label>Përshkrimi<textarea id="description" rows="3"></textarea></label><label>Masat dhe gjendja</label><div id="sizesEditor" style="display:flex;gap:12px;flex-wrap:wrap;margin:12px 0 20px"></div><label>Foto (JPG, PNG, WEBP, maksimumi 5 MB)<input id="photo" type="file" accept="image/jpeg,image/png,image/webp"></label><button id="saveButton" type="submit">Ruaj produktin</button><button type="button" id="cancelEdit" class="secondary hidden">Anulo ndryshimin</button></form></section><section class="panel"><div class="top"><h2>Produktet</h2><button id="reload" class="secondary">Rifresko</button></div><div id="products" class="products"></div></section></div>
</main>
<script>

const SUPABASE_URL = 'https://cyzyhrmtvskxviepllxc.supabase.co';
const SUPABASE_KEY='sb_publishable_CfUc2HB3GcBrvyV7wTjFLw_8dFiAlWv';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
let editing=null,existingImage=null,products=[];
const sizeOptions=['XS','S','M','L','XL','XXL','ONE SIZE'];
const sizesEditor=document.getElementById('sizesEditor');
for(const size of sizeOptions){const label=document.createElement('label');label.style.cssText='display:flex;align-items:center;gap:5px;font-size:13px';const cb=document.createElement('input');cb.type='checkbox';cb.dataset.size=size;cb.style.cssText='width:auto;margin:0';label.append(cb,document.createTextNode(size+' në gjendje'));sizesEditor.append(label)}
function getSizes(){const stock={};for(const cb of sizesEditor.querySelectorAll('input'))stock[cb.dataset.size]=cb.checked;return stock}
function setSizes(stock){for(const cb of sizesEditor.querySelectorAll('input'))cb.checked=!!(stock||{})[cb.dataset.size]}

function message(t){$('message').textContent=t||''}
function resetForm(){$('productForm').reset();editing=null;existingImage=null;setSizes({});$('formTitle').textContent='Shto produkt';$('saveButton').textContent='Ruaj produktin';$('cancelEdit').classList.add('hidden')}
async function checkAdmin(){const {data:{user},error}=await db.auth.getUser();if(error||!user)return false;const {data,error:e}=await db.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();if(e)throw e;return !!data}
async function refreshAuth(){try{const {data:{session}}=await db.auth.getSession();const ok=session&&await checkAdmin();$('loginPanel').classList.toggle('hidden',!!ok);$('adminArea').classList.toggle('hidden',!ok);$('logout').classList.toggle('hidden',!session);if(ok)await loadProducts();else if(session)message('Kjo llogari nuk është autorizuar si administratore.')}catch(e){message('Gabim gjatë kontrollit: '+e.message)}}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();message('Duke hyrë...');const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){message(error.message);return}message('');await refreshAuth()});
$('logout').onclick=async()=>{await db.auth.signOut();resetForm();products=[];message('Dole nga llogaria.');await refreshAuth()};
function imagePath(url){try{const u=new URL(url);const prefix='/storage/v1/object/public/product-images/';if(u.origin!==new URL(SUPABASE_URL).origin||!u.pathname.startsWith(prefix))return null;return decodeURIComponent(u.pathname.slice(prefix.length))}catch{return null}}
async function upload(file){if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('Lejohen vetëm JPG, PNG ose WEBP.');if(file.size>5*1024*1024)throw Error('Fotoja nuk duhet të kalojë 5 MB.');const ext=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg';const path=crypto.randomUUID()+'.'+ext;const {error}=await db.storage.from('product-images').upload(path,file,{contentType:file.type,upsert:false});if(error)throw error;return {path,url:db.storage.from('product-images').getPublicUrl(path).data.publicUrl}}
$('productForm').addEventListener('submit',async e=>{e.preventDefault();const btn=$('saveButton');btn.disabled=true;message('Duke ruajtur...');let uploaded=null;try{if(!await checkAdmin())throw Error('Nuk ke leje administratori.');const file=$('photo').files[0];if(!file&&!existingImage)throw Error('Zgjidh një foto.');if(file)uploaded=await upload(file);const item={name:$('name').value.trim(),price:$('price').value.trim(),description:$('description').value.trim(),image_url:uploaded?uploaded.url:existingImage,sizes_stock:getSizes()};if(!item.name)throw Error('Shkruaj emrin e produktit.');const result=editing?await db.from('products').update(item).eq('id',editing).select():await db.from('products').insert(item).select();if(result.error)throw result.error;if(editing&&uploaded){const old=imagePath(existingImage);if(old)await db.storage.from('product-images').remove([old])}resetForm();message('Produkti u ruajt me sukses.');await loadProducts()}catch(err){if(uploaded)await db.storage.from('product-images').remove([uploaded.path]);message('Gabim: '+err.message)}finally{btn.disabled=false}});
$('cancelEdit').onclick=resetForm;
$('reload').onclick=loadProducts;
async function loadProducts(){const {data,error}=await db.from('products').select('id,name,price,description,image_url,created_at,sizes_stock').order('created_at',{ascending:false});if(error){message('Gabim gjatë leximit: '+error.message);return}products=data||[];const root=$('products');root.replaceChildren();if(!products.length){root.textContent='Nuk ka ende produkte.';return}for(const p of products){const card=document.createElement('article');card.className='product';const img=document.createElement('img');img.src=p.image_url;img.alt=p.name;img.loading='lazy';const h=document.createElement('h3');h.textContent=p.name;const price=document.createElement('p');price.textContent=p.price||'Pa çmim';const desc=document.createElement('p');desc.className='muted';desc.textContent=p.description||'';const stockInfo=document.createElement('p');stockInfo.className='muted';stockInfo.textContent='Në gjendje: '+Object.entries(p.sizes_stock||{}).filter(([s,v])=>v).map(([s])=>s).join(', ');const edit=document.createElement('button');edit.className='secondary';edit.textContent='Ndrysho';edit.onclick=()=>{editing=p.id;existingImage=p.image_url;$('name').value=p.name;$('price').value=p.price||'';$('description').value=p.description||'';setSizes(p.sizes_stock);$('photo').value='';$('formTitle').textContent='Ndrysho produktin';$('saveButton').textContent='Ruaj ndryshimet';$('cancelEdit').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})};const del=document.createElement('button');del.className='danger';del.textContent='Fshi';del.onclick=async()=>{if(!confirm('Ta fshijmë produktin "'+p.name+'"?'))return;del.disabled=true;const {error}=await db.from('products').delete().eq('id',p.id);if(error){message('Gabim: '+error.message);del.disabled=false;return}const path=imagePath(p.image_url);if(path)await db.storage.from('product-images').remove([path]);if(editing===p.id)resetForm();message('Produkti u fshi.');await loadProducts()};card.append(img,h,price,desc,stockInfo,edit,del);root.append(card)}}
refreshAuth();
</script></body></html>
